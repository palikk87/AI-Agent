# Render blueprint for SeeMyGD.
#
# THIS FILE DOES NOT DECIDE WHICH BRANCH DEPLOYS. Read this before assuming it.
#
# There is no `branch:` key below, which reads as "tracks the default branch",
# i.e. main. That is wrong. The Render dashboard pins the branch and the
# dashboard wins over this blueprint. The service currently deploys from:
#
#     claude/seemygd-garage-door-tool-2dg3dw
#
# Settings > Build > Branch, in the Render dashboard, is the only source of
# truth. Deploying means pushing to that branch. A merge to main builds
# nothing, silently — no queued deploy, no error, no signal of any kind.
#
# main is deliberately ~7 commits behind the deploy branch and is expected to
# stay that way. Do not "fix" this by repointing the service at main: main is
# missing the app.seemygd.com cutover and "Trust any *.seemygd.com origin for
# auth", so repointing rolls those back and breaks subdomain sign-in. If that
# is ever wanted, merge the deploy branch into main FIRST, confirm the trees
# match, and only then change the branch in the dashboard.
#
# In Render: New → Blueprint → pick this repo. Set the blueprint's root
# directory to `seemygd`. Secrets are marked sync:false, so Render prompts for
# them once instead of storing them in git.
#
# Copy the values from the old Vibecode .env. Two of them matter more than the rest:
#   BETTER_AUTH_SECRET — reuse the EXISTING value, or every owner is logged out.
#   DATABASE_URL       — Supabase POOLED string (port 6543), not the direct one.

services:
  - type: web
    name: seemygd
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # The service runs on free, and this line used to claim starter. That is a
    # meaningful difference: free spins the instance down after ~15 minutes idle
    # and the next request pays 43-52s to wake it (measured). The mismatch sent
    # us looking for a caching bug that did not exist, because starter does not
    # sleep and the symptom therefore "shouldn't" have been possible.
    # .github/workflows/keepwarm.yml pings the service to stop it sleeping.
    # If this is ever moved to a paid plan, update this line AND delete that
    # workflow — it exists only to work around the free tier.
    plan: free
    healthCheckPath: /health
    autoDeploy: true

    domains:
      - app.seemygd.com

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000

      # Public URL of this service. Square webhook signatures are verified
      # against this exact value, so it must match what Square is configured with.
      - key: BACKEND_URL
        value: https://app.seemygd.com
      - key: FRONTEND_URL
        value: https://app.seemygd.com
      - key: EXTRA_TRUSTED_ORIGINS
        sync: false

      # --- Supabase ---
      # DATABASE_URL: Transaction pooler, port 6543 (runtime queries)
      # DIRECT_URL:   Direct connection, port 5432 (prisma migrate deploy)
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BRANDING_BUCKET
        value: branding

      # --- Better Auth --- reuse the existing secret, do not generate a new one
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: SUPER_ADMIN_EMAIL
        sync: false
      - key: ADMIN_SECRET
        sync: false
      - key: PREVIEW_SIGNING_SECRET
        sync: false

      # --- OpenAI (gpt-image-1 door swap + hero re-render) ---
      - key: OPENAI_API_KEY
        sync: false

      # --- Diagnostics ---
      # Gates the /api/garage/detect trace, which can return the gridded source
      # images — the customer's own photo. Sent as the x-debug-secret header.
      # sync:false so Render prompts once and no value lands in git. Leaving it
      # unset disables the trace; the gate denies rather than defaults open.
      - key: DEBUG_TRACE_SECRET
        sync: false

      # --- Email (Resend) ---
      - key: RESEND_API_KEY
        sync: false
      - key: LEAD_NOTIFICATION_EMAIL
        sync: false

      # --- Square subscriptions ---
      - key: SQUARE_ENVIRONMENT
        sync: false
      - key: SQUARE_ACCESS_TOKEN
        sync: false
      - key: SQUARE_APPLICATION_ID
        sync: false
      - key: SQUARE_LOCATION_ID
        sync: false
      - key: SQUARE_WEBHOOK_SIGNATURE_KEY
        sync: false
